name: Scorecard

# OpenSSF Scorecard: the third-party read of this repository's supply-chain posture
# (pinned actions, token permissions, branch protection, signed releases, and so on).
# Results go to code scanning as SARIF and are published to the public Scorecard API.
# Same shape as district-macos and district-ios.
#
# ⛔ SKIPPED WHILE THE REPOSITORY IS PRIVATE. Publishing needs a public repository, and
# code scanning is not available to a private one on the free plan.
#
# Not on pull requests: scorecard-action documents that trigger as experimental, and
# publishing needs `id-token: write`, which means nothing on a PR.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday, so a check that decays with time still reports
  workflow_dispatch:

# Nothing at the top level; the one job below asks for exactly what it uses.
permissions: {}

# One run per ref at a time. Nothing is cancelled: each run publishes the result for its
# commit.
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scorecard:
    name: OpenSSF Scorecard
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the code
      actions: read # read the workflow runs Scorecard inspects
      # Upload the SARIF to code scanning.
      security-events: write
      # Sign the published result, so the public API can tell it came from this repo.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
          category: scorecard
